<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pelanggan - Keripik Kentang Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #F6A90A; /* Gold */
            --color-secondary: #FF7A00; /* Orange */
            --color-text: #333333;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Background menggunakan gambar yang berbeda dari admin untuk pembeda visual */
            background: linear-gradient(135deg, rgba(100, 130, 52, 0.8), rgba(74, 53, 37, 0.8)), url('https://images.unsplash.com/photo-1599490659213-e2b9527bd087?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;
            color: var(--color-text);
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .logo-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-header i {
            font-size: 3rem;
            color: var(--color-primary);
            margin-bottom: 1rem;
            background: -webkit-linear-gradient(var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-header h1 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 800;
            color: #4A3525;
        }

        .logo-header p {
            color: #666;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #4A3525;
        }

        .input-icon-wrap {
            position: relative;
        }

        .input-icon-wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #A0A0A0;
            transition: 0.3s;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1.5px solid #E0E0E0;
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(246, 169, 10, 0.15);
        }

        .form-control:focus + i, .input-icon-wrap:focus-within i {
            color: var(--color-primary);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-wrap input {
            accent-color: var(--color-primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-pass {
            color: var(--color-secondary);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .forgot-pass:hover {
            color: var(--color-primary);
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            font-family: var(--font-heading);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(246, 169, 10, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(246, 169, 10, 0.4);
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .register-link a {
            color: var(--color-secondary);
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
            color: var(--color-primary);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .glass-card {
                padding: 2rem 1.5rem;
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            color: white;
            z-index: 9999;
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background: linear-gradient(135deg, #2BC155, #00A651); }
        .toast.error { background: linear-gradient(135deg, #ff4d4d, #c0392b); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none !important; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="glass-card">
            <div class="logo-header">
                <i class="fa-solid fa-leaf"></i>
                <h1>Kentang Emas</h1>
                <p>Login untuk memberikan rating & ulasan produk.</p>
            </div>

            <!-- Formulir Firebase Authentication -->
            <form id="login-user-form">
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <div class="input-icon-wrap">
                        <input type="email" id="email" class="form-control" placeholder="Masukkan email Anda" required>
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-wrap">
                        <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrap">
                        <input type="checkbox" id="remember">
                        <span>Ingat saya</span>
                    </label>
                    <a href="#" class="forgot-pass">Lupa Password?</a>
                </div>

                <button type="submit" class="btn-login" id="btn-login-user">Masuk</button>
            </form>

            <div class="register-link">
                Belum punya akun? <a href="register.html">Daftar sekarang</a>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Firebase Script (ES Module) -->
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const form = document.getElementById('login-user-form');
        const btnLogin = document.getElementById('btn-login-user');
        const toast = document.getElementById('toast');

        function showToast(message, type = 'success') {
            toast.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'circle-check' : 'circle-xmark'}"></i> ${message}`;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast('Login berhasil! Mengarahkan...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1500);
            } catch (error) {
                let message = 'Terjadi kesalahan. Coba lagi.';
                if (error.code === 'auth/user-not-found') message = 'Email tidak terdaftar!';
                if (error.code === 'auth/wrong-password') message = 'Password salah!';
                if (error.code === 'auth/invalid-email') message = 'Format email tidak valid!';
                if (error.code === 'auth/invalid-credential') message = 'Email atau password salah!';
                showToast(message, 'error');
                btnLogin.disabled = false;
                btnLogin.innerHTML = 'Masuk';
            }
        });
    </script>

</body>
</html>
