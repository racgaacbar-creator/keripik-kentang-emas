# =====================================================
# Kubernetes Service — Keripik Kentang
# =====================================================
apiVersion: v1
kind: Service
metadata:
  name: keripik-kentang-service
  namespace: default
  labels:
    app: keripik-kentang
spec:
  selector:
    app: keripik-kentang
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
