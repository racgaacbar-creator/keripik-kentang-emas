# =====================================================
# Kubernetes Network Policy — Keripik Kentang
# Hanya izinkan traffic masuk ke port 8080
# =====================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keripik-kentang-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: keripik-kentang
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 443   # HTTPS ke Firebase
        - protocol: TCP
          port: 53    # DNS
    - ports:
        - protocol: UDP
          port: 53    # DNS UDP
