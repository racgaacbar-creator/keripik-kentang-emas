name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # JOB 1: Secret Scanning
  secret-scan:
    name: "Secret Scanning (TruffleHog)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # JOB 2: SAST Scanning
  sast-scan:
    name: "SAST Scanning (Semgrep)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          pip install semgrep
          semgrep --config=p/javascript --config=p/html --config=p/owasp-top-ten --error . || true

  # JOB 3: Dependency Audit
  dependency-audit:
    name: "Dependency Audit"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for package.json
        id: check-pkg
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> $GITHUB_OUTPUT
          else
            echo "has_pkg=false" >> $GITHUB_OUTPUT
          fi

      - name: Run npm audit
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Skip audit
        if: steps.check-pkg.outputs.has_pkg == 'false'
        run: echo "No package.json found, skipping dependency audit."

  # JOB 4: Docker Security Scan (laporan saja, tidak block deploy)
  docker-scan:
    name: "Docker Security Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-audit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t keripik-kentang:test .

      - name: Run Trivy scanner (report only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "keripik-kentang:test"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Trivy scan complete
        run: echo "Trivy scan complete - check report above for vulnerabilities"

  # JOB 5: Deploy (hanya jika semua lolos)
  deploy:
    name: "Deploy ke Firebase Hosting"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-scan, dependency-audit, docker-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: keripik-kentang-1826e
          channelId: live