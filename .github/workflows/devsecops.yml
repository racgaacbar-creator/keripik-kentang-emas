# =====================================================
# DevSecOps Pipeline — Keripik Kentang
# Fase 3: Security scanning sebelum deploy
# =====================================================
name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================
  # JOB 1: Secret Scanning — Cegah kebocoran password/API key
  # ============================================================
  secret-scan:
    name: "?? Secret Scanning (TruffleHog)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (scan for secrets/credentials)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ============================================================
  # JOB 2: SAST — Static Application Security Testing
  # ============================================================
  sast-scan:
    name: "??? SAST Scanning (Semgrep)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/html
            p/owasp-top-ten
            p/xss
            p/injection
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Run Semgrep (no token fallback)
        if: ${{ !secrets.SEMGREP_APP_TOKEN }}
        run: |
          pip install semgrep
          semgrep --config=p/javascript --config=p/html --error .

  # ============================================================
  # JOB 3: Dependency Audit
  # ============================================================
  dependency-audit:
    name: "?? Dependency Audit"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for package.json
        id: check-pkg
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> $GITHUB_OUTPUT
          else
            echo "has_pkg=false" >> $GITHUB_OUTPUT
          fi

      - name: Run npm audit
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Skip (no package.json)
        if: steps.check-pkg.outputs.has_pkg == 'false'
        run: echo "No package.json found, skipping dependency audit."

  # ============================================================
  # JOB 4: Docker Security Scan
  # ============================================================
  docker-scan:
    name: "?? Docker Security Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-audit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t keripik-kentang:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "keripik-kentang:test"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # ============================================================
  # JOB 5: Deploy — Hanya jika semua scan lolos
  # ============================================================
  deploy:
    name: "?? Deploy ke Firebase Hosting"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-scan, dependency-audit, docker-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: keripik-kentang-1826e
          channelId: live
