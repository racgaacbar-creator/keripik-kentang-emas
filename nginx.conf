server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # -- Security Headers --
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https://*.googleapis.com https://*.gstatic.com https://*.firebaseapp.com https://*.firebaseio.com; script-src 'self' 'unsafe-inline' https://*.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleapis.com https://firebasestorage.googleapis.com;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Sembunyikan versi nginx
    server_tokens off;

    # -- Gzip Compression --
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # -- Static Files Cache --
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # -- HTML: no cache --
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # -- Blokir akses ke file sensitif --
    location ~ /\.(git|env|firebase|dockerignore) {
        deny all;
        return 404;
    }

    # -- Fallback --
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # -- Error pages --
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
